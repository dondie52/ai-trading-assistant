# Render Blueprint — Dondie API
# Production host used by Vercel: https://ai-trading-assistant-cgpp.onrender.com/api/v1
services:
  - type: web
    name: ai-trading-assistant-cgpp
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build:packages && npm run prisma:generate -w @trading/api && npm run build -w @trading/api
    startCommand: npm run start -w @trading/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://axrclxwittqyurwqjvdq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://axrclxwittqyurwqjvdq.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: BROKER_CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-trading-assistant-web.vercel.app
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_ENVIRONMENT
        value: PAPER
      - key: DONDIE_SCHEDULER_ENABLED
        value: "true"
      - key: MFA_REQUIRED
        value: "false"
