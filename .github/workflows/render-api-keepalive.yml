# Keeps the free Render API from spinning down after ~15 minutes of idle traffic.
# Pings the public health endpoint; no secrets required.

name: Render API keepalive

on:
  schedule:
    # Under the 15-minute free-tier idle window (GitHub cron can drift a few minutes).
    - cron: "*/12 * * * *"
  workflow_dispatch:

concurrency:
  group: render-api-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render trading API
        env:
          RENDER_API_HEALTH_URL: ${{ vars.RENDER_API_HEALTH_URL }}
        run: |
          set -euo pipefail
          URL="${RENDER_API_HEALTH_URL:-https://ai-trading-assistant-cgpp.onrender.com/api/v1/health}"
          echo "Pinging ${URL}"

          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS -o /tmp/render-api-health.json -w "%{http_code}" \
              --max-time 90 \
              -H "Accept: application/json" \
              "$URL" || echo "000")

            echo "Attempt ${attempt}: HTTP ${HTTP_CODE}"
            head -c 500 /tmp/render-api-health.json || true
            echo

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Render API keepalive OK"
              exit 0
            fi

            sleep 12
          done

          echo "::error::Render API did not become healthy"
          exit 1
