name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  # Lets a branch be validated without opening a pull request first.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run validate

