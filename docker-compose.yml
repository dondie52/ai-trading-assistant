services:
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: npm run start -w @trading/api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the Supabase pooled DATABASE_URL in .env}
      API_PORT: 3001
      AI_SERVICE_URL: http://ai-service:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env}
      BROKER_CREDENTIAL_ENCRYPTION_KEY: ${BROKER_CREDENTIAL_ENCRYPTION_KEY:?Set BROKER_CREDENTIAL_ENCRYPTION_KEY in .env}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_ENVIRONMENT: ${ALPACA_ENVIRONMENT:-PAPER}
      ALLOW_ALPACA_LIVE_TRADING: ${ALLOW_ALPACA_LIVE_TRADING:-false}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      ai-service:
        condition: service_started

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      WEB_PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  ai-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/ai-service.Dockerfile
    environment:
      MODEL_VERSION: mvp-baseline-1.0.0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
